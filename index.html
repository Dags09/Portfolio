<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jewelle | Portfolio</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/animation.css" />
    </head>
    <body>
        <canvas id="starfield"></canvas>
        <section id="intro">
            <p class="intro-eyebrow">— welcome —</p>
            <h1 class="intro-title">
                <span class="intro-line">Welcome to</span>
                <span class="intro-line intro-name">Jewelle's Portfolio</span>
            </h1>
            <button
                id="enter-btn"
                class="intro-enter"
                aria-label="Enter portfolio"
            >
                <span>enter</span>
            </button>
        </section>

        <main id="main-content">
            <section id="hero">
                <p class="section-label">/ hero — coming next</p>
            </section>
        </main>

        <script src="js/starfield.js" defer></script>
        <script src="js/main.js" defer></script>
    </body>
</html>
